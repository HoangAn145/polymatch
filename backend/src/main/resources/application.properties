server.port=8080

# Gemini API Key
gemini.api.key=YOUR_GEMINI_API_KEY_HERE

# Cấu hình H2 Database (In-Memory)
spring.datasource.url=jdbc:h2:mem:polymatchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cấu hình JPA / Hibernate cho H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Bật giao diện H2 Console để xem dữ liệu trên trình duyệt (Tùy chọn)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console